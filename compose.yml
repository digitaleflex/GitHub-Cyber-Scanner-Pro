services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cyber_scanner_db
    restart: always
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_DB: ${DB_NAME:-scanner_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cyber-scanner:
    build: .
    container_name: cyber_github_scanner
    restart: always
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-scanner_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DOMAIN: ${DOMAIN:-cyberbook.eurin.tech}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GH_TOKENS: ${GH_TOKENS}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HF_API_KEY: ${HF_API_KEY}
      TOR_PROXY_HOST: ${TOR_PROXY_HOST:-172.18.0.1}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT:-9050}
      TOR_ENABLED: ${TOR_ENABLED:-true}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MINIFLUX_ENABLED: ${MINIFLUX_ENABLED:-false}
      NEO4J_AUTH_NONE: "true"
    networks:
      - default
      - proxy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cyberscan.rule=Host(`${DOMAIN:-cyberbook.eurin.tech}`)"
      - "traefik.http.routers.cyberscan.entrypoints=websecure"
      - "traefik.http.routers.cyberscan.tls=true"
      - "traefik.http.routers.cyberscan.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cyberscan.priority=100"
      - "traefik.http.services.cyberscan.loadbalancer.server.port=8000"

  neo4j:
    image: neo4j:5
    container_name: cyber_neo4j
    restart: always
    mem_limit: 2g
    cpus: "1.0"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms.memory.heap.initial_size=512M
      - NEO4J_dbms.memory.heap.max_size=1G
    volumes:
      - neo4j-data:/data

volumes:
  pgdata:
  neo4j-data:

  searxng:
    image: searxng/searxng:latest
    container_name: cyber_searxng
    restart: always
    mem_limit: 256m
    cpus: "0.3"
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=cyberscan-searxng-secret-key-change-me
    volumes:
      - ./data/searxng:/etc/searxng
    networks:
      - default

networks:
  proxy:
    external: true
