services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cyber_scanner_db
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    environment:
      POSTGRES_DB: ${DB_NAME:-scanner_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyberpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cyber-scanner:
    build: .
    container_name: cyber_github_scanner
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-scanner_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-cyberpass}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-86400}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cyberscan.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cyberscan.tls=true"
      - "traefik.http.routers.cyberscan.tls.certresolver=letsencrypt"
      - "traefik.http.services.cyberscan.loadbalancer.server.port=8000"

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
