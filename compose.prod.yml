services:
  cyber-scanner:
    build: .
    container_name: cyber_github_scanner
    restart: always
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

  caddy:
    image: caddy:2-alpine
    container_name: cyber_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cyber-scanner

volumes:
  caddy_data:
  caddy_config:
