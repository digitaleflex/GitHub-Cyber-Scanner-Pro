services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cyber_scanner_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-scanner_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cyber-scanner:
    build: .
    container_name: cyber_github_scanner
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-scanner_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GH_TOKENS: ${GH_TOKENS}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-86400}
      NEO4J_AUTH_NONE: "false"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cybergraph}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cyberscan.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cyberscan.tls=true"
      - "traefik.http.routers.cyberscan.tls.certresolver=letsencrypt"
      - "traefik.http.services.cyberscan.loadbalancer.server.port=8000"

  neo4j:
    image: neo4j:5
    container_name: cyber_neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cybergraph}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms.memory.heap.initial_size=512M
      - NEO4J_dbms.memory.heap.max_size=1G
    volumes:
      - neo4j-data:/data
    networks:
      - internal

volumes:
  pgdata:
  neo4j-data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
